<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمون‌یار هشتم | تست درس‌های پایه هشتم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f3b;--paper:#f2f6ff;--line:#dbe4fb;--white:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#f2f6ff;--paper:#161a33;--line:#222850;--white:#1f2447}}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;min-height:100vh;line-height:1.8}
#app{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:900;margin:12px 0 0;line-height:1.2}
.hero p{font-size:1.1rem;margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card,.opt,.btn,.back{border:3px solid var(--ink);background:var(--white);border-radius:16px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.card:hover,.opt:hover,.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.card{background:var(--c);color:#1b1f3b;padding:18px;text-align:right;display:flex;flex-direction:column;gap:2px}
.card .em{font-size:2.4rem;line-height:1.2}.card b{font-size:1.5rem;font-weight:900}.card small{font-size:.95rem}
.back{padding:4px 14px;box-shadow:3px 3px 0 var(--ink);border-radius:999px;margin-bottom:14px}
.head{background:var(--c);color:#1b1f3b;border:3px solid var(--ink);border-radius:20px;padding:18px 20px;box-shadow:6px 6px 0 var(--ink);margin-bottom:22px}
.head h2{margin:0;font-size:2rem;font-weight:900}.head p{margin:0}
.list{display:grid;gap:14px}
.btn{padding:12px 20px;font-weight:800;background:var(--c,#ffb703);color:#1b1f3b}
.topic{text-align:right;display:flex;justify-content:space-between;align-items:center;font-size:1.15rem}
.bar{height:14px;border:3px solid var(--ink);border-radius:99px;background:var(--white);overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.q{font-size:1.3rem;font-weight:800;margin:0 0 16px}
.opts{display:grid;gap:12px;margin-bottom:22px}
.opt{padding:12px 16px;text-align:right;width:100%}
.opt.sel{background:var(--c);color:#1b1f3b}
.meta{display:flex;justify-content:space-between;font-weight:600}
.score{text-align:center;background:var(--white);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:24px;margin-bottom:22px}
.score .n{font-size:5rem;font-weight:900;line-height:1.1;color:var(--ink)}
.rev{background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.rev.ok{border-inline-start-width:12px;border-color:#2a9d4a}.rev.no{border-inline-start-width:12px;border-color:#e63946}
.rev p{margin:2px 0}.good{color:#1f8a3b;font-weight:800}.bad{color:#d62839;font-weight:800}
@media(prefers-color-scheme:dark){.good{color:#6ee08a}.bad{color:#ff7a85}}
[dir=auto]{unicode-bidi:plaintext}
.foot{text-align:center;margin-top:36px;font-size:.9rem;opacity:.8}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{background-image:radial-gradient(circle at 12% 8%,#ffb70355 0,transparent 26%),radial-gradient(circle at 90% 18%,#4cc9f055 0,transparent 28%),radial-gradient(circle at 70% 95%,#ff8fab44 0,transparent 30%),linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:auto,auto,auto,28px 28px,28px 28px;background-attachment:fixed}
.hero{background:var(--white);border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:26px 22px 22px;margin-bottom:30px;position:relative;overflow:hidden}
.hero h1{margin:0;background:linear-gradient(90deg,#e76f51,#c77dff,#00a6d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.strip{display:flex;gap:10px;font-size:2rem;margin-top:10px;flex-wrap:wrap}
.strip span{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:0 10px;box-shadow:3px 3px 0 var(--ink);animation:pop .5s backwards}
.strip span:nth-child(2){animation-delay:.08s}.strip span:nth-child(3){animation-delay:.16s}.strip span:nth-child(4){animation-delay:.24s}.strip span:nth-child(5){animation-delay:.32s}.strip span:nth-child(6){animation-delay:.4s}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.card{border-radius:22px;padding:20px;min-height:170px;justify-content:space-between;position:relative;overflow:hidden}
.card:nth-child(odd){transform:rotate(-.7deg)}.card:nth-child(even){transform:rotate(.7deg)}
.card:hover{transform:translate(2px,2px) rotate(0)}
.card .em{font-size:3rem;background:#ffffff88;border:3px solid #1b1f3b;border-radius:18px;width:68px;height:68px;display:grid;place-items:center;line-height:1}
.card small{background:#1b1f3b;color:#fff;border-radius:99px;padding:0 12px;align-self:flex-start;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;font-weight:600}
.opt::before{content:"";flex:none;width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;background:var(--white)}
.opt.sel::before{background:var(--ink);box-shadow:inset 0 0 0 4px var(--c)}
.score .n{background:linear-gradient(90deg,#d62839,#6a00f4);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:6rem}
.score{animation:pop .5s}
.head{border-radius:24px;box-shadow:7px 7px 0 var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

["در ترکیب «کتابِ علی» کدام نوع ترکیب است؟",["وصفی", "اضافی", "عطفی", "مرکب"],1],
["در جملهٔ «من آمدم و او رفت» حرف ربط کدام است؟",["من", "آمدم", "و", "رفت"],2],
["در عبارت «گل زیبا»، واژهٔ «زیبا» چه نقشی دارد؟",["اسم", "صفت", "فعل", "قید"],1],
["فعل «خواهم رفت» در چه زمانی است؟",["گذشته", "حال", "آینده", "امر"],2]]}]},
{n:"زبان انگلیسی",e:"🔤",c:"#7ae7c7",t:[
{n:"Grammar",q:[
["She ___ to school every day.",["go","goes","going","gone"],1],
["I ___ playing football now.",["am","is","are","be"],0],
["There ___ two books on the table.",["is","am","are","be"],2],
["Yesterday I ___ a movie.",["watch","watching","watches","watched"],3]]},
{n:"Vocabulary",q:[
["What is the opposite of “hot”?",["warm","cold","big","fast"],1],
["Which one is a fruit?",["apple","chair","pencil","door"],0],
["A doctor works in a ___.",["school","bakery","hospital","garage"],2],
["We borrow books from a ___.",["library","kitchen","stadium","bank"],0]]},{n:"Tenses (Advanced)",q:[
["If it rains tomorrow, we ___ at home.",["stay", "will stay", "stayed", "staying"],1],
["He has already ___ his homework.",["finish", "finishing", "finished", "finishes"],2],
["They ___ TV when I called them.",["watch", "were watching", "watches", "is watching"],1],
["My sister is taller ___ me.",["that", "then", "than", "as"],2]]},{n:"Reading & Vocabulary (Advanced)",q:[
["The word “enormous” means:",["very small", "very big", "very old", "very fast"],1],
["I don't have ___ money.",["some", "any", "a", "an"],1],
["What is the plural of “child”?",["childs", "childes", "children", "childrens"],2],
["“How long have you lived here?” Choose the best answer.",["Yesterday.", "For five years.", "At school.", "Two books."],1]]}]}
];

const app=document.getElementById('app');
const fa=n=>Number(n).toLocaleString('fa-IR');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=h=>{app.innerHTML=h;window.scrollTo(0,0)};
let Q=[],k=0,ans=[],si=0,ti=0;

function home(){
  show(`<header class="hero"><h1>آزمون‌یار هشتم</h1><p>درس را انتخاب کن، تست بزن و نمره‌ات را از ۲۰ ببین.</p><div class="strip"><span>➗</span><span>⚡</span><span>🧪</span><span>🧬</span><span>📖</span><span>🔤</span></div></header>
  <div class="grid">${S.map((s,i)=>`<button class="card" style="--c:${s.c}" onclick="subject(${i})"><span class="em">${s.e}</span><b>${s.n}</b><small>${fa(s.t.length)} سرفصل، ${fa(s.t.reduce((a,t)=>a+t.q.length,0))} تست</small></button>`).join('')}</div>
  <p class="foot">هر درس چهار سرفصل دارد و دو سرفصل آخر در سطح پیشرفته‌اند. پاسخنامهٔ کامل بعد از پایان نمایش داده می‌شود.</p>`);
}
function subject(i){
  si=i;const s=S[i];
  show(`<button class="back" onclick="home()">بازگشت به درس‌ها</button>
  <div class="head" style="--c:${s.c}"><h2>${s.e} ${s.n}</h2><p>یک سرفصل را برای شروع آزمون انتخاب کن.</p></div>
  <div class="list">${s.t.map((t,j)=>`<button class="btn topic" style="--c:${s.c}" onclick="start(${j})"><span dir="auto">${t.n}</span><span>${fa(t.q.length)} تست</span></button>`).join('')}</div>`);
}
function start(j){
  ti=j;
  Q=shuffle(S[si].t[j].q).map(q=>({q:q[0],o:shuffle(q[1].map((t,i)=>({t,ok:i===q[2]})))}));
  ans=Array(Q.length).fill(-1);k=0;ask();
}
function ask(){
  const s=S[si],q=Q[k],last=k===Q.length-1;
  show(`<button class="back" onclick="subject(${si})">خروج از آزمون</button>
  <div class="meta"><span>${s.n}: <span dir="auto">${s.t[ti].n}</span></span><span>سؤال ${fa(k+1)} از ${fa(Q.length)}</span></div>
  <div class="bar" style="--c:${s.c}"><i style="width:${(k)/Q.length*100}%"></i></div>
  <p class="q" dir="auto">${q.q}</p>
  <div class="opts" style="--c:${s.c}">${q.o.map((o,i)=>`<button class="opt${ans[k]===i?' sel':''}" dir="auto" onclick="pick(${i})">${o.t}</button>`).join('')}</div>
  <button class="btn" id="nx" style="--c:${s.c}" onclick="next()" ${ans[k]<0?'disabled style="opacity:.5;--c:'+s.c+'"':''}>${last?'پایان و دیدن نمره':'سؤال بعدی'}</button>`);
}
function pick(i){ans[k]=i;ask()}
function next(){if(ans[k]<0)return;if(k<Q.length-1){k++;ask()}else finish()}
function finish(){
  const s=S[si],ok=Q.filter((q,i)=>q.o[ans[i]].ok).length,sc=(ok/Q.length*20);
  const msg=sc>=18?"عالی بود! 🎉":sc>=14?"خیلی خوبه، ادامه بده!":sc>=10?"قابل قبوله، با مرور بهتر هم می‌شه.":"نگران نباش، درس رو مرور کن و دوباره امتحان بده.";
  show(`<div class="score" style="background:${s.c};color:#1b1f3b"><div>نمره تو از ۲۰</div><div class="n">${fa(+sc.toFixed(2))}</div>
  <div>${fa(ok)} پاسخ درست از ${fa(Q.length)} تست</div><p style="margin:8px 0 0;font-weight:800">${msg}</p></div>
  <h2>پاسخنامه</h2>
  ${Q.map((q,i)=>{const good=q.o[ans[i]].ok,c=q.o.find(o=>o.ok).t;return `<div class="rev ${good?'ok':'no'}"><p dir="auto"><b>${fa(i+1)}. ${q.q}</b></p>
  <p>پاسخ تو: <span dir="auto" class="${good?'good':'bad'}">${q.o[ans[i]].t}</span></p>${good?'':`<p>پاسخ درست: <span dir="auto" class="good">${c}</span></p>`}</div>`}).join('')}
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><button class="btn" style="--c:${s.c}" onclick="start(${ti})">آزمون دوباره</button>
  <button class="btn" style="--c:${s.c}" onclick="subject(${si})">سرفصل‌های ${s.n}</button><button class="btn" style="--c:#fff" onclick="home()">صفحه اصلی</button></div>`);
}
home();
</script>
</body>
</html>
